repository: chakibelbassam/FoundationOS
base_branch: codex/development-workspace
trunk_branch: main
branch_prefix: edge-opencode
draft_until_validated: true
merge:
  actor: owner
  method: owner-choice
attribution:
  author: "Edge-{harness} ({model})"
  email: "edge-{harness}@foundationos.local"
visibility:
  terminal_skill: computer-use/opencode-terminal
  banner: Edge/tools/Show-GitContext.ps1
commits:
  trailers:
    - "Work-Item: {work_item}"
    - "Agent: Edge-{harness} ({model})"
checks:
  - npm test
  - node Edge/tools/scrumWorkSpace.mjs validate
release:
  tag_on_acceptance: true
  tag_prefix: v
  notes_from: scrum-evidence
review:
  channels:
    - github-web
    - chat-relay
