<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FoundationOS · viewport QA</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; background: #1b1f27; color: #e8eefc; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
      header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #242a35; border-bottom: 1px solid #313a48; }
      header strong { font-size: 13px; letter-spacing: 0.02em; }
      header span { opacity: 0.75; }
      main { display: grid; place-items: start center; padding: 18px; }
      iframe { width: 390px; height: 600px; border: 1px solid #4a5568; border-radius: 8px; background: #fff; box-shadow: 0 18px 50px rgba(0,0,0,0.4); }
      code { color: #9dc2ff; }
    </style>
  </head>
  <body>
    <header>
      <strong>FoundationOS viewport QA</strong>
      <span id="label">390 × 600 CSS px</span>
      <span>This frame is the app's real layout viewport. Open the URL the launcher printed, then connect inside the frame.</span>
    </header>
    <main><iframe id="frame" title="FoundationOS client at the requested viewport" src="/"></iframe></main>
    <script>
      const params = new URLSearchParams(location.search);
      const width = Math.min(900, Math.max(280, Number(params.get('w')) || 390));
      const height = Math.min(1200, Math.max(400, Number(params.get('h')) || 600));
      const url = params.get('url') || '/';
      const frame = document.getElementById('frame');
      frame.style.width = width + 'px';
      frame.style.height = height + 'px';
      frame.src = url;
      document.getElementById('label').textContent = width + ' × ' + height + ' CSS px · ' + url;
    </script>
  </body>
</html>
